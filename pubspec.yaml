name: iqbal_app
description: Allama Iqbal offline poetry - Collection of Urdu/Persian poetry
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.6
  audioplayers: ^5.2.1
  url_launcher: ^6.2.5
  yaml: ^3.1.2
  shared_preferences: ^2.2.2
  hive_flutter: ^1.1.0
  hive: ^2.2.3
  google_fonts: ^6.2.1
  device_preview: ^1.1.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.1
  hive_generator: ^2.0.0
  build_runner: ^2.4.6
  flutter_launcher_icons: ^0.13.1

flutter_launcher_icons:
  android: true
  ios: true
  image_path: "assets/images/icon.png"
  adaptive_icon_background: "#1F1410"
  adaptive_icon_foreground: "assets/images/icon.png"
  min_sdk_android: 21
  web:
    generate: true
    image_path: "assets/images/icon.png"
    background_color: "#1F1410"
    theme_color: "#D7263D"
  windows:
    generate: true
    image_path: "assets/images/icon.png"
    icon_size: 48
  macos:
    generate: true
    image_path: "assets/images/icon.png"

flutter:
  uses-material-design: true
  assets:
    - assets/images/
    - assets/data/
    - assets/data/list-of-lists.yaml
    - assets/data/lists/
    - assets/poems/001/
    - assets/poems/002/
    - assets/poems/003/
    - assets/poems/004/
    - assets/poems/005/
    - assets/poems/006/
    - assets/poems/007/
    - assets/poems/008/
    - assets/poems/009/
    - assets/poems/010/
    - assets/poems/011/

  fonts:
    - family: JameelNoori
      fonts:
        - asset: assets/fonts/Jameel Noori Nastaleeq Regular.ttf
    - family: JameelNooriBold
      fonts:
        - asset: assets/fonts/Jameel Noori Nastaleeq Regular.ttf
          weight: 700